[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-xai"
version = "1.0.0b1"
description = "An adaptive explainable-AI framework for integrating XAI into machine learning projects."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Charan" },
    { name = "Dhyan KJ" },
    { name = "Jeevitha Shetty" },
    { name = "Poorvi J Poojary" },
]
dependencies = [
    "pandas",
    "numpy",
    "nbformat",
]

[project.scripts]
adaptive-xai = "adaptive_xai.run:main"
analyze = "adaptive_xai.model_analyzer.analyzer:main"
xai-select = "adaptive_xai.xai_selector.cli:main"
convert = "adaptive_xai.notebook_converter:main"

[tool.setuptools.packages.find]
include = ["adaptive_xai*"]

[tool.setuptools.package-data]
"adaptive_xai.explanation_generator" = ["templates/*.json"]