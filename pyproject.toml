[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "adaptive-xai"
version = "0.3.2"
description = "Improve explanation quality"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas",
    "numpy",
    "nbformat",
]


[project.scripts]
adaptive-xai = "framework.run:main"
analyze = "framework.model_analyzer.analyzer:main"
xai-select = "framework.xai_selector.cli:main"

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.setuptools.package-data]
"framework.explanation_generator" = ["templates/*.json"]