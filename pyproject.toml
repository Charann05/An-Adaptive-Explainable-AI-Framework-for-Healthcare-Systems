[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "adaptive-xai"
version = "0.4.0"
description = "Add notebook-to-script convertion tool"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas",
    "numpy",
    "nbformat",
]


[project.scripts]
adaptive-xai = "adaptive_xai.run:main"
analyze = "adaptive_xai.model_analyzer.analyzer:main"
xai-select = "adaptive_xai.xai_selector.cli:main"
convert = "adaptive_xai.notebook_converter:main"

[tool.setuptools.packages.find]
include = ["adaptive_xai*"]

[tool.setuptools.package-data]
"adaptive_xai.explanation_generator" = ["templates/*.json"]