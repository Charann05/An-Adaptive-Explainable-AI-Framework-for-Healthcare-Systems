[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "adaptive-xai"
version = "0.2.8"
description = "Update model loader to be compatible with the legacy Keras arguments."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas",
    "numpy",
    "nbformat",
]


[project.scripts]
adaptive-xai = "framework.run:main"

[tool.setuptools.packages.find]
include = ["framework*"]